services:

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: azurite
    hostname: azurite
    ports:
      - "10001:10001" # Queue service port
    command: "azurite --queueHost 0.0.0.0"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:10001/devstoreaccount1" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  sqs:
    image: softwaremill/elasticmq-native
    container_name: sqs
    hostname: sqs
    ports:
      - "9324:9324" # API port
      - "9325:9325" # Admin UI port
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9324" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
